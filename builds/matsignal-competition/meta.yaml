summary: "MatSignal is a free tool for jiu-jitsu teams: keep a squad, see who from it is entered at upcoming competitions, and post one competition's link in the team chat. It's the first build in this journal that is a product rather than a page, with its own subdomain, its own private repository, its own infrastructure and real people's names in it. Claude Code took it from a problem I have myself to live in four working days and about 4 h 50 min of agent time, and it's worth it for that, as long as a human keeps the decisions about data and has every change reviewed: its own tests caught its worst bug, and independent reviews caught more. The caveat: one competition is covered so far, copied in by hand for this proof-of-concept phase (automating that is next), and nothing yet shows that anyone besides me wants it. This log gets an update after that competition, on November 14."
