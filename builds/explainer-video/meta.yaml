# Content-collection fields. Perishable facts (version, pricing, verified date)
# are kept separate from the evergreen narrative so they update in one place.
# This file is CANONICAL: site/src/content.config.ts mirrors it exactly. If you
# add a field in one, add it in the other — they must not drift.
#
# STATUS: PUBLISHED 2026-07-24. Human verify pass signed off by the human (PROCESS §5),
# so status → verified and published/last_verified are set. Price + YouTube captured.
# The HeyGen affiliate link was deliberately NOT allowed to block publish (approval time
# is unknown) — it's backlogged as a follow-up; `affiliate_url` stays blank until it lands
# and the verdict CTA turns on automatically when it's added. Operational figures
# (time/takes/credits) were never logged and are left blank rather than invented.
title: "What I learned making my first AI explainer video with HeyGen"
slug: "explainer-video"   # the .mdx filename under site/src/content/builds/ IS the slug
category: "video"         # first Video-category build
# Three distinct roles — do not merge them:
#   1. tool        the PRIMARY tool under review. The /tools index key AND the
#                  affiliate target. Exactly one per build.
#   2. built_with  the production AIs used to MAKE the build.
#   3. stack       supporting tools/services the build runs on.
# built_with and stack are DISPLAY-ONLY: they never create a /tools entry and are
# never affiliate-linked. That visible link/no-link split is what shows a reader
# which tool is actually under review, without having to explain it.
tool: "HeyGen"
tool_version: ""      # omitted on purpose: HeyGen is an un-versioned hosted service
                      # (CONTEXT §5). The avatar engine name (Avatar IV / Video Agent)
                      # can be mentioned in prose but is NOT a pinnable version — it
                      # does not go in the stamp.
built_with: ["Claude Opus 4.8", "ChatGPT 5.6"]   # Claude: planning + script + frame-level
                      # QA. ChatGPT: adversarial reviewer — argued the Synthesia case,
                      # critiqued the output. Display-only; no links, never indexed.
stack: ["YouTube"]    # the video host/embed — the one supporting tool THIS build
                      # required. Synthesia is NOT stack: it was evaluated and rejected,
                      # so it lives in the selection narrative, not here. Do not inherit
                      # the site's permanent infra onto this build (CONTEXT §5).
runs_on_site: true    # the finished video is embedded on this build page — the dogfood
                      # badge applies. Only stays true once the embed is actually live.
status: verified      # human verify pass signed off (PROCESS §5). Set by/for a human,
                      # not on the agent's own say-so — see the STATUS note at top.
summary: "I made a 70-second video explaining what Jigg.AI is, with an AI presenter I never filmed — no camera, no face, no voice of my own — using HeyGen. If you want a short explainer and you're starting from nothing, it is an AI tool worth your time: it kept my script word-for-word, looked credible on the first paid render, and took an afternoon. The one caveat: the free tier watermarks everything and caps you at 60 seconds, so shipping means paying — and the avatar I picked left black bars on the plain talking-head shots, which I'd fix next time."
test_score: "Fresh-viewer clarity 3/3 · avatar/voice natural, no uncanny flags · 15s bake-off decided it vs Synthesia"   # video has no single X/30 — composite verdict; the number-ish parts live in test.md
affiliate_url: ""     # BACKLOGGED, not blocking. Applied to HeyGen's Rewardful program;
                      # approval time unknown, so publish did not wait on it. Add the real
                      # link (+ terms/cookie window from the official dashboard) when it
                      # lands — the verdict CTA turns on automatically. Never invent a link
                      # or state commission numbers from memory/aggregators.
repro_pack: false     # the pack is not fully assembled (media clips + the human-owned
                      # prompt/exchange exports are still outstanding — see repro/README.md).
                      # flip to true only if a gated download is actually built.
published: "2026-07-24"       # human verify pass signed off.
last_verified: "2026-07-24"
pricing_as_of: "2026-07-24"   # CAPTURED. Real paid HeyGen "Creator" plan: US$32.06 incl.
                      # tax (from the receipt the human provided). This dates the cost as
                      # accurate/captured today; it is NOT claimed as the exact receipt/
                      # purchase date — swap in the receipt date if a precise one is wanted.
                      # Subscription, so per-finished-minute depends on monthly output —
                      # the concrete captured figure is the plan price. See test.md.

# Cost / hosting / framework detail does NOT go in the top stamp — author those as
# fact tiles in the .mdx body so the stamp stays one compact line.

# ---- display + tool-projection helpers (rendered by the site) ----
featured: true        # the explainer of what Jigg.AI is → the home hero, per the human's
                      # "this is the home/featured artifact." pickFeatured() takes the most-
                      # recent featured build, so this auto-demotes build #1 (which keeps
                      # featured: true and resumes the hero if #3 is ever unpublished) —
                      # CONTEXT §6, no manual editing of #1 needed.
meta_line: "one afternoon · 70s render · 15s bake-off vs Synthesia"
video_id: "gIMQJcLP6L4"   # YouTube embed ID — drives the VideoEmbed artifact preview.
                      # Clean watch URL: https://youtu.be/gIMQJcLP6L4 (the ?si=… share-
                      # tracking token is stripped — it is not part of a canonical ref).
                      # Embedded via youtube-nocookie.com. One place to update on re-render.

# /tools is a PROJECTION of the builds collection — there is no separate tools
# source of truth, so a tool's own facts live on the build. When several builds
# share a tool, the most-recent build's tool_* values win (see site/src/lib/builds.ts).
tool_summary: "AI avatar video maker, hosted"   # no pricing claim until the receipt is captured
tool_verdict: "Kept my script exact and looked credible on the first paid render — a written script to a finished video in an afternoon, no camera and no face. Where it is not the pick: structured training/L&D content, where Synthesia's presenter-led approach fits better. Go in knowing the free tier is for evaluating, not publishing — you pay to ship anything real."
accessibility: "Beginner-friendly"   # pick an avatar, paste a script, render — no code.
                      # The one thing a beginner won't expect is that the free tier can't
                      # ship (watermark + 60s cap); that's a caveat, not a setup barrier.

# Anything richer than these flat facts — the honest-process steps, test-stat
# tiles, the reproduce pack, the tool verdict card — is authored in the .mdx BODY
