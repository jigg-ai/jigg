# Netlify build configuration.
# The site lives in site/, not the repo root, so `base` points Netlify there:
# `command` runs inside site/, and `publish` is resolved RELATIVE TO base
# (i.e. site/dist). Astro static output — no adapter needed.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

  # Skip the build entirely when a commit can't change what's served. Roughly a third
  # of this repo's commits touch only PROCESS/BACKLOG/builds/* — byte-identical site
  # output — and each one was costing a full metered production deploy (15 credits).
  #
  # Exit 0 means "ignore this build", non-zero means "build it", so `git diff --quiet`
  # has exactly the right polarity: no changes in the watched paths → skip.
  #
  # Three details here are load-bearing; all three fail silently if you get them wrong:
  #
  # 1. `:/` anchors each pathspec to the REPO ROOT. This command runs from the base
  #    directory (site/), so a bare `-- site/` would resolve to site/site/, never match,
  #    and skip every deploy forever — including real content changes. The site would
  #    quietly stop updating with nothing in the logs to say why.
  # 2. The range is $CACHED_COMMIT_REF..$COMMIT_REF, i.e. everything in the push. With
  #    HEAD^..HEAD, pushing three commits where only the middle one touched site/ would
  #    skip the deploy and leave published content stale.
  # 3. netlify.toml is watched too. It sits at the repo root, outside site/, so a change
  #    to THIS file (Lighthouse thresholds, this rule) must still trigger a build.
  #
  # If $CACHED_COMMIT_REF is empty (no cache, first build) the command errors, exits
  # non-zero, and Netlify builds — the safe direction to fail in.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- :/site/ :/netlify.toml"

[build.environment]
  # Pin the Node version for reproducible builds (Astro 7 needs a current Node).
  NODE_VERSION = "22"

# Serverless functions live in site/netlify/functions (relative to base = "site").
# subscribe.mjs proxies newsletter signups to Buttondown's authenticated API so the
# browser never has to hit Buttondown cross-origin. Reads BUTTONDOWN_API_KEY from the
# Netlify environment.
[functions]
  directory = "netlify/functions"

# Lighthouse on every deploy. This closes test.md check #7 (performance, previously
# "Not run" with no score to claim) and gives check #8 a real accessibility NUMBER —
# though note an automated Lighthouse a11y score is NOT a formal audit; it catches a
# subset of issues. Don't upgrade check #8 to a full pass on this alone.
#
# Running it per-deploy rather than once by hand is deliberate: a score measured once
# and quoted forever is exactly the stale claim this project exists to avoid.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "reports/lighthouse.html"

  # Audit the views that actually matter, not just the home page: the archive and the
  # tools index are generated from the builds collection, so they're where a regression
  # would show up first.
  [[plugins.inputs.audits]]
    path = "/"
  [[plugins.inputs.audits]]
    path = "builds/"
  [[plugins.inputs.audits]]
    path = "tools/"
  [[plugins.inputs.audits]]
    path = "builds/website/"

  # NO failing thresholds yet — ON PURPOSE. We have never measured this site, so any
  # threshold set now would be a guess, and a guessed threshold either fails deploys
  # for no reason or passes vacuously. Record the first real scores, then set
  # thresholds just under the baseline so genuine regressions break the build.
